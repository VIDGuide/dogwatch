name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Unit tests (Python 3.12, pinned deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # Compile *every* module, not a hand-maintained subset. The previous
      # explicit list silently omitted static_suppressor.py, export-daily-events.py,
      # render_zone_overlay.py, pipeline/stats.py, pipeline/find-dogs.py and
      # pipeline/find-dogs-mqtt.py — find-dogs.py alone is ~870 lines that were
      # never even syntax-checked.
      - name: Syntax check all Python modules
        run: |
          python -m compileall -q . -x '(\.git|__pycache__)'

      # test_detector.py is no longer excluded: detector.py now imports
      # ai_edge_litert lazily (inside _make_interpreter), so its pure-Python
      # tensor bookkeeping is importable and testable without the ML runtime.
      - name: Run unit tests
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/hardware_smoke_test.py \
            --ignore=tests/probe_image.py \
            --ignore=tests/gemini_image_quality_check.py \
            --ignore=tests/gemini_batch_label.py

  docker-build:
    name: Docker image build (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build detector image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: dogwatch:ci

      - name: Build notifier image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./pipeline
          platforms: linux/amd64
          push: false
          tags: dogwatch-notify:ci

  shell-lint:
    name: Shell script syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n syntax check
        run: |
          for f in pipeline/*.sh *.sh; do
            [ -e "$f" ] || continue
            echo "Checking $f"
            bash -n "$f"
          done

      # bash -n only catches parse errors. shellcheck catches the class of bug
      # that actually bit here: dog-alarm.sh called bump_stats ~100 lines before
      # it was defined, so both early-exit paths emitted "command not found" and
      # never recorded the two most interesting failure counters.
      #
      # Advisory for now (|| true): the existing scripts have not been triaged
      # against shellcheck yet, and a hard gate would fail on pre-existing
      # findings unrelated to a given PR. Promote to blocking (drop `|| true`)
      # once the backlog is clean.
      - name: shellcheck (advisory)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=warning pipeline/*.sh *.sh || true
