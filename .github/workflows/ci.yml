name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


# Third-party actions are pinned to full commit SHAs, not to `@v4`-style tags.
#
# A major-version tag is a mutable pointer the action's owner can re-point at
# any time, and a compromised maintainer account (or a pushed tag on a
# compromised repo) therefore silently changes what runs here — with access to
# the workflow's token and to anything in the checkout. That is not
# hypothetical: it is how the tj-actions/changed-files compromise reached
# thousands of repos, by retargeting existing tags at a malicious commit.
#
# A SHA cannot be re-pointed, so an update becomes a visible, reviewable diff.
# The trailing comment records which release each SHA is, since the SHA alone
# tells you nothing. To bump one:
#
#   git ls-remote --tags https://github.com/actions/checkout | grep 'v4\.'
#
# then update both the SHA and the comment. Dependabot understands this format
# and will raise the bump PRs for you if you enable it.
jobs:
  test:
    name: Unit tests (Python 3.12, pinned deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      # Compile *every* module, not a hand-maintained subset. The previous
      # explicit list silently omitted static_suppressor.py, export-daily-events.py,
      # render_zone_overlay.py, pipeline/stats.py, pipeline/find-dogs.py and
      # pipeline/find-dogs-mqtt.py — find-dogs.py alone is ~870 lines that were
      # never even syntax-checked.
      - name: Syntax check all Python modules
        run: |
          python -m compileall -q . -x '(\.git|__pycache__)'

      # test_detector.py is no longer excluded: detector.py now imports
      # ai_edge_litert lazily (inside _make_interpreter), so its pure-Python
      # tensor bookkeeping is importable and testable without the ML runtime.
      - name: Run unit tests
        run: |
          python -m pytest tests/ -v \
            --ignore=tests/hardware_smoke_test.py \
            --ignore=tests/probe_image.py \
            --ignore=tests/gemini_image_quality_check.py \
            --ignore=tests/gemini_batch_label.py

  docker-build:
    name: Docker image build (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build detector image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: dogwatch:ci

      - name: Build notifier image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./pipeline
          platforms: linux/amd64
          push: false
          tags: dogwatch-notify:ci

  shell-lint:
    name: Shell script syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: bash -n syntax check
        run: |
          for f in pipeline/*.sh *.sh; do
            [ -e "$f" ] || continue
            echo "Checking $f"
            bash -n "$f"
          done

      # bash -n only catches parse errors. shellcheck catches the class of bug
      # that actually bit here: dog-alarm.sh called bump_stats ~100 lines before
      # it was defined, so both early-exit paths emitted "command not found" and
      # never recorded the two most interesting failure counters.
      #
      # Advisory for now (|| true): the existing scripts have not been triaged
      # against shellcheck yet, and a hard gate would fail on pre-existing
      # findings unrelated to a given PR. Promote to blocking (drop `|| true`)
      # once the backlog is clean.
      - name: shellcheck (advisory)
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck --severity=warning pipeline/*.sh *.sh || true
